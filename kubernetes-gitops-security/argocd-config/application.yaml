apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-portfolio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: devops-portfolio
    app.kubernetes.io/part-of: multi-cloud-devops-portfolio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/priyaranjan-sahu/multi-cloud-devops-portfolio.git
    targetRevision: HEAD
    path: kubernetes-gitops-security/helm-charts
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.repository
          value: devops-portfolio/app
        - name: image.tag
          value: "latest"
        - name: ingress.enabled
          value: "true"
        - name: ingress.hosts[0].host
          value: devops-portfolio.local
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
  revisionHistoryLimit: 10
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-portfolio-infra
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: devops-portfolio-infra
    app.kubernetes.io/part-of: multi-cloud-devops-portfolio
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/priyaranjan-sahu/multi-cloud-devops-portfolio.git
    targetRevision: HEAD
    path: multi-cloud-infra/terraform-aws
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      jsonPointers:
        - /data
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: devops-portfolio
  namespace: argocd
  description: DevOps Portfolio Project
spec:
  description: Multi-Cloud DevOps Portfolio Project
  sourceRepos:
    - https://github.com/priyaranjan-sahu/multi-cloud-devops-portfolio.git
  destinations:
    - namespace: devops-portfolio
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: ''
      kind: Service
    - group: networking.k8s.io
      kind: Ingress
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: monitoring.coreos.com
      kind: ServiceMonitor
  roles:
    - name: admin
      description: Admin role for devops-portfolio
      policies:
        - p, proj:devops-portfolio:admin, applications, *, devops-portfolio/*, allow
      groups:
        - devops-team
    - name: read-only
      description: Read-only access
      policies:
        - p, proj:devops-portfolio:read-only, applications, get, devops-portfolio/*, allow
      groups:
        - developers
