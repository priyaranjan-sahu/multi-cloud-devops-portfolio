name: kyverno-policy-tests

policies:
  - policy-disallow-latest-tag.yaml
  - policy-require-labels.yaml

resources:
  - resource-good-pod.yaml
  - resource-bad-pod.yaml

results:
  - policy: disallow-latest-tag
    rule: check-image-tag
    resources: [good-pod]
    kind: Pod
    result: pass
  - policy: require-labels
    rule: check-for-labels
    resources: [good-pod]
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: check-image-tag
    resources: [bad-pod]
    kind: Pod
    result: fail
  - policy: require-labels
    rule: check-for-labels
    resources: [bad-pod]
    kind: Pod
    result: fail
