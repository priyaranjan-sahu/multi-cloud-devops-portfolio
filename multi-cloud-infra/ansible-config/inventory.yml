        #   ansible_ssh_private_key_file: ~/.ssh/devops-portfolio.pem
        # gcp-instance-1:
        #   ansible_host: 5.6.7.8
        #   ansible_user: ubuntu
        #   ansible_ssh_private_key_file: ~/.ssh/devops-portfolio.pem
        # azure-instance-1:
        #   ansible_host: 9.10.11.12
        #   ansible_user: azureuser
        #   ansible_ssh_private_key_file: ~/.ssh/devops-portfolio.pem
      vars:
        ansible_python_interpreter: /usr/bin/python3
