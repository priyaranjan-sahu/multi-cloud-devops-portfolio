schemaVersion: "2.0.0"

metadataTest:
  exposedPorts:
    - "8080"
  user: "appuser"
  entrypoint: ["/app/main"]

fileExistenceTests:
  - name: "Binary exists"
    path: "/app/main"
    shouldExist: true
  - name: "CA certificates exist"
    path: "/etc/ssl/certs/ca-certificates.crt"
    shouldExist: true
  - name: "Timezone data exists"
    path: "/usr/share/zoneinfo"
    shouldExist: true
  - name: "Passwd file exists"
    path: "/etc/passwd"
    shouldExist: true

fileContentTests:
  - name: "Passwd contains appuser"
    path: "/etc/passwd"
    expectedContents:
      - "appuser:x:[0-9]+:[0-9]+:"

commandTests:
  - name: "Version flag"
    command: "/app/main"
    args: ["-version"]
    exitCode: 0
    expectedOutput:
      - "Version:"
